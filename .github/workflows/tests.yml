name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: auto_quality
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: auto_quality
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auto_quality"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://auto_quality:ci_test_only@127.0.0.1:5432/auto_quality
      AUTO_QUALITY_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .
      - name: Test normalization and database refresh behavior
        run: python -m pytest -q
      - name: Check Python syntax
        run: python -m compileall -q src app.py scripts tests
